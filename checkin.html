<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#175f72">
<title>เช็คอินหน้างาน · โรงพยาบาลสันทราย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f6;--bg2:#e9eaec;--surface:#fff;--surface2:#fbfbfc;
  --border:#dcdee1;--border2:#c7cacd;
  --primary:#175f72;--primary-dk:#0f4552;--primary-lt:#e7f0f2;
  --gold:#96702f;--gold-lt:#f3ede3;
  --green:#1c6b52;--green-lt:#e5f0eb;
  --red:#a13d3d;--red-lt:#f6ecec;
  --text:#25282b;--text-2:#565b60;--text-3:#8b9096;
  --sans:'Noto Sans Thai','Tahoma',sans-serif;
  --r:8px;--r-lg:12px;--r-xl:16px;
  --sh:0 1px 3px rgba(20,24,28,.06),0 2px 8px rgba(20,24,28,.05);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
header{background:var(--primary-dk);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex-shrink:0}
header h1{font-size:16px;font-weight:700}
header .sub{font-size:11.5px;opacity:.8;font-weight:400}
.stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border-radius:var(--r);padding:6px 12px;text-align:center;min-width:64px}
.stat b{display:block;font-size:18px;line-height:1.1}
.stat span{font-size:10px;opacity:.85}
.stat.green b{color:#7ee6c0}
.stat.gold b{color:#f3d08a}
.stat.red b{color:#f5a3a3}
#reload-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;
  border-radius:var(--r);padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
#reload-btn:hover{background:rgba(255,255,255,.2)}
#reload-btn:disabled{opacity:.5;cursor:default}

/* ── Search bar ── */
.search-wrap{padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#search{width:100%;font-size:18px;padding:14px 16px;border:1.5px solid var(--border2);border-radius:var(--r-lg);
  font-family:inherit;background:var(--surface2)}
#search:focus{outline:none;border-color:var(--primary);background:#fff}
.filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filters button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:20px;
  border:1.5px solid var(--border2);background:var(--surface);color:var(--text-2);cursor:pointer}
.filters button.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ── List ── */
#list{flex:1;overflow-y:auto;padding:10px 18px 90px}
.empty{text-align:center;color:var(--text-3);padding:60px 20px;font-size:14px}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;
  margin-bottom:8px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.card.done{border-color:var(--green);background:var(--green-lt)}
.card.declined{opacity:.6}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.dot.gold{background:var(--gold)}
.dot.green{background:var(--green)}
.dot.red{background:var(--red)}
.info{flex:1;min-width:0}
.name{font-size:16px;font-weight:700;line-height:1.3}
.sub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.tag-declined{color:var(--red);font-weight:800;font-size:11px}
.ci-time{font-size:11.5px;color:var(--green);font-weight:600;margin-top:2px}
.action-btn{font-family:inherit;font-weight:700;font-size:14px;padding:12px 20px;border-radius:var(--r);
  border:none;cursor:pointer;flex-shrink:0;min-height:44px}
.action-btn.checkin{background:var(--primary);color:#fff}
.action-btn.checkin:active{background:var(--primary-dk)}
.action-btn.undo{background:transparent;color:var(--text-3);border:1.5px solid var(--border2);font-size:12.5px;padding:10px 14px}

/* ── Toast ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);
  color:#fff;padding:12px 22px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:.25s;box-shadow:var(--sh);z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#toast.ok{background:var(--green)}

#load-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;z-index:100;font-size:14px;color:var(--text-2)}
#load-overlay.hidden{display:none}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:640px){
  header{padding:12px 14px}header h1{font-size:14px}.stats{gap:6px}.stat{padding:5px 8px;min-width:52px}
  .search-wrap,#list{padding-left:14px;padding-right:14px}
}
</style>
</head>
<body>

<div id="load-overlay">
  <div class="spinner"></div>
  <div>กำลังโหลดรายชื่อ...</div>
</div>

<header>
  <div>
    <h1>✅ จุดเช็คอินหน้างาน</h1>
    <div class="sub">งานมุทิตาจิตแด่ผู้เกษียณอายุราชการ โรงพยาบาลสันทราย ประจำปี 2569</div>
  </div>
  <div class="stats">
    <div class="stat green"><b id="st-done">0</b><span>มาแล้ว</span></div>
    <div class="stat gold"><b id="st-wait">0</b><span>รอเช็คอิน</span></div>
    <div class="stat"><b id="st-total">0</b><span>ทั้งหมด</span></div>
  </div>
  <button id="reload-btn" onclick="loadPeople()">🔄 รีเฟรช</button>
</header>

<div class="search-wrap">
  <input id="search" type="text" placeholder="พิมพ์ชื่อ / ฝ่ายงาน / ตำแหน่ง เพื่อค้นหา..." autofocus oninput="render()">
  <div class="filters">
    <button id="f-wait" class="on" onclick="setFilter('wait')">รอเช็คอิน</button>
    <button id="f-done" onclick="setFilter('done')">เช็คอินแล้ว</button>
    <button id="f-all" onclick="setFilter('all')">ทั้งหมด</button>
  </div>
</div>

<div id="list"></div>
<div id="toast"></div>

<script>
// ⚠️ ต้องเป็น URL เดียวกับที่ seat.html ใช้ (Web App เดียวกัน) และต้อง
// deploy code.gs เวอร์ชันที่มี action "checkin"/"undo_checkin" แล้ว
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwzimtNiUsNPYelNocjhzshTdoJ8392hYSix4lWxf2cGHVWsMBybBHBUzyFkq8iq2_EeQ/exec';

let people = [];
let filter = 'wait'; // wait | done | all
let busyIds = new Set(); // ป้องกันแตะรัว ๆ ระหว่างรอ request ค้าง

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function gasPost(payload){
  const resp = await fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'text/plain'}});
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  return resp.json();
}

function toast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show'+(type?' '+type:'');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>t.classList.remove('show'),2200);
}

function setFilter(f){
  filter=f;
  ['wait','done','all'].forEach(k=>document.getElementById('f-'+k).classList.toggle('on',k===f));
  render();
}

async function loadPeople(){
  const btn=document.getElementById('reload-btn');
  btn.disabled=true;
  try{
    const d=await gasPost({action:'get_seat_data'});
    if(d.status!=='ok') throw new Error(d.message||'โหลดข้อมูลไม่สำเร็จ');
    people=d.people||[];
    document.getElementById('load-overlay').classList.add('hidden');
    render();
  }catch(err){
    document.getElementById('load-overlay').innerHTML =
      `<div style="color:var(--red);font-weight:700">โหลดข้อมูลไม่สำเร็จ</div>
       <div style="font-size:12.5px;color:var(--text-2)">${esc(err.message)}</div>
       <button id="reload-btn" onclick="location.reload()" style="margin-top:8px;background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-family:inherit;font-weight:600;cursor:pointer">ลองใหม่</button>`;
  }finally{
    btn.disabled=false;
  }
}

function updateStats(){
  const total=people.length;
  const done=people.filter(p=>p.status==='checkin').length;
  document.getElementById('st-total').textContent=total;
  document.getElementById('st-done').textContent=done;
  document.getElementById('st-wait').textContent=Math.max(0,total-done);
}

function render(){
  updateStats();
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  let list=people;
  if(filter==='wait') list=list.filter(p=>p.status!=='checkin');
  else if(filter==='done') list=list.filter(p=>p.status==='checkin');
  if(q){
    list=list.filter(p=>
      p.name.toLowerCase().includes(q) ||
      (p.dept||'').toLowerCase().includes(q) ||
      (p.position||'').toLowerCase().includes(q)
    );
  }
  // เรียงคนที่ยังไม่เช็คอินขึ้นก่อน แล้วตามด้วยชื่อ
  list=list.slice().sort((a,b)=>{
    if((a.status==='checkin')!==(b.status==='checkin')) return a.status==='checkin'?1:-1;
    return a.name.localeCompare(b.name,'th');
  });

  const box=document.getElementById('list');
  if(!list.length){
    box.innerHTML = q
      ? `<div class="empty">ไม่พบชื่อที่ตรงกับ "${esc(q)}"</div>`
      : (filter==='wait' ? `<div class="empty">🎉 เช็คอินครบทุกคนแล้ว</div>` : `<div class="empty">ไม่มีรายชื่อในหมวดนี้</div>`);
    return;
  }

  box.innerHTML = list.map(p=>{
    const declined = p.intent==='ไม่เข้าร่วม';
    const done = p.status==='checkin';
    const dotClass = declined ? 'red' : (done ? 'green' : 'gold');
    const subParts = [p.position, p.dept].filter(Boolean).join(' · ');
    const busy = busyIds.has(String(p.id));
    let action;
    if(done){
      action = `<button class="action-btn undo" ${busy?'disabled':''} onclick="doUndo('${p.id}')">ยกเลิก</button>`;
    } else {
      action = `<button class="action-btn checkin" ${busy?'disabled':''} onclick="doCheckin('${p.id}','${esc(p.name).replace(/'/g,"\\'")}')">${busy?'กำลังบันทึก...':'มาถึงแล้ว ✓'}</button>`;
    }
    return `<div class="card ${done?'done':''} ${declined?'declined':''}">
      <div class="dot ${dotClass}"></div>
      <div class="info">
        <div class="name">${esc(p.name)}${declined?' <span class="tag-declined">· แจ้งไม่เข้าร่วม</span>':''}</div>
        <div class="sub">${esc(subParts)||'&nbsp;'}</div>
        ${done && p.checkinTime ? `<div class="ci-time">เช็คอินเมื่อ ${esc(p.checkinTime)}</div>` : ''}
      </div>
      ${action}
    </div>`;
  }).join('');
}

async function doCheckin(id,name){
  if(busyIds.has(id)) return;
  busyIds.add(id); render();
  try{
    const d=await gasPost({action:'checkin',personId:id,personName:name});
    if(d.status!=='ok') throw new Error(d.message||'เช็คอินไม่สำเร็จ');
    const p=people.find(x=>String(x.id)===String(id));
    if(p){p.status='checkin';p.checkinTime=d.time||'';}
    toast(`เช็คอินแล้ว: ${name}`,'ok');
  }catch(err){
    toast('เช็คอินไม่สำเร็จ: '+err.message,'err');
  }finally{
    busyIds.delete(id); render();
  }
}

async function doUndo(id){
  if(busyIds.has(id)) return;
  busyIds.add(id); render();
  try{
    const d=await gasPost({action:'undo_checkin',personId:id});
    if(d.status!=='ok') throw new Error(d.message||'ยกเลิกไม่สำเร็จ');
    const p=people.find(x=>String(x.id)===String(id));
    if(p){p.status='registered';p.checkinTime='';}
    toast('ยกเลิกเช็คอินแล้ว','ok');
  }catch(err){
    toast('ยกเลิกไม่สำเร็จ: '+err.message,'err');
  }finally{
    busyIds.delete(id); render();
  }
}

// รีเฟรชอัตโนมัติทุก 20 วิ เผื่อมีเจ้าหน้าที่คนอื่นเช็คอินจากเครื่องอื่นพร้อมกัน
// (ข้ามรอบถ้ากำลังพิมพ์ค้นหาอยู่ กันช่องค้นหากระตุกระหว่างพิมพ์)
setInterval(()=>{
  if(document.activeElement && document.activeElement.id==='search') return;
  loadPeople();
},20000);

loadPeople();
</script>
</body>
</html>
